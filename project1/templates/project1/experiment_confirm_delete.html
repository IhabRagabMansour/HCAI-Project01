{% extends 'project1/base.html' %}
{% load static %}

{% block page_title %}Delete {{ experiment.name }}{% endblock %}

{% block project1_content %}
<div class="p1-section p1-confirm-delete">
    <p>Are you sure you want to delete <strong>{{ experiment.name }}</strong>?</p>
    <p style="color:#777; font-size:14px;">This cannot be undone.</p>
</div>

<div class="p1-action-row">
    <a href="{% url 'project1:experiment_detail' experiment.pk %}">
        <button type="button">Cancel</button>
    </a>
    <form method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Yes, delete</button>
    </form>
</div>
{% endblock %}
