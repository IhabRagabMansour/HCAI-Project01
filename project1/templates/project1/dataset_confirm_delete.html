{% extends 'project1/base.html' %}

{% block page_title %}Delete Dataset{% endblock %}

{% block project1_content %}
<div class="p1-section p1-confirm-delete">
    <p class="centered-text">Are you sure you want to delete <strong>{{ dataset.original_name }}</strong>?</p>
    <p class="centered-text p1-hint">This will permanently remove the file and all associated data.</p>

    <form method="post">
        {% csrf_token %}
        <div class="p1-action-row">
            <a href="{% url 'project1:dataset_detail' dataset.pk %}"><button type="button">Cancel</button></a>
            <button type="submit" class="btn-danger">Yes, delete</button>
        </div>
    </form>
</div>
{% endblock %}
